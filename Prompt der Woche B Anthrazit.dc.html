<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#E4E5E7; font-family:'Open Sans', Helvetica, Arial, sans-serif; }
  a { color:#FF5900; text-decoration:none; }
  a:hover { color:#333333; }
</style>
</helmet>
<div style="padding:34px; display:flex; flex-direction:column; gap:18px; align-items:flex-start;">
  <div style="display:flex; flex-direction:column; gap:5px;">
    <div style="font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase; color:#FF5900; font-weight:700;">Vorschlag B</div>
    <div style="font-size:21px; font-weight:700; color:#333333;">Terminal in Hausfarben</div>
    <div style="font-size:12.5px; line-height:1.55; color:#616161; max-width:520px;">Dieselbe Terminal-Idee, aber in Anthrazit, Orange und Gold. Erkennbar als mh-Kachel, trotzdem eigenständig gegenüber den weißen Fachbeiträgen.</div>
  </div>
  <canvas ref="{{ cv }}" style="width:520px; height:520px; border:1px solid #CFD2D5;"></canvas>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:760}}">
const KICKER = 'PROMPT DER WOCHE · KW 35';
const TITEL = 'Gläubigerliste aus dem Kontoauszug';
const PROMPT = 'Lies die beigefügten Kontoauszüge der letzten sechs Monate. Erstelle eine Tabelle aller wiederkehrenden Zahlungsempfänger mit Betrag, Intervall und letzter Zahlung. Markiere Sozialversicherungsträger und Finanzamt separat.';
const NOTE = 'Die Zeitangabe und das Tabellenformat lassen dem Modell keinen Interpretationsspielraum.';

class Component extends DCLogic {
  cv = React.createRef();
  componentDidMount() {
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.paint());
    this.paint();
  }
  wrap(ctx, text, maxW) {
    const out = [];
    let cur = '';
    String(text).split(/\s+/).filter(Boolean).forEach(w => {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t;
    });
    if (cur) out.push(cur);
    return out;
  }
  paint() {
    const c = this.cv.current;
    if (!c) return;
    const W = 1080, H = 1080;
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    const INK = '#2C353D', ORANGE = '#FF5900', GOLD = '#EFBB20', GREY = '#A9B0B6';
    const sans = (w, s) => w + ' ' + Math.round(s) + 'px "Open Sans", Arial, sans-serif';
    const mono = (w, s) => w + ' ' + Math.round(s) + 'px "IBM Plex Mono", ui-monospace, monospace';
    const pad = 88, footH = 124;
    ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = ORANGE; ctx.fillRect(0, 0, W, 24);
    ctx.textBaseline = 'top';

    let y = 84;
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '4px';
    ctx.font = sans('700', 30);
    ctx.fillStyle = GOLD;
    ctx.fillText(KICKER, pad, y);
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';
    y += 66;

    ctx.font = sans('700', 62);
    ctx.fillStyle = '#FFFFFF';
    this.wrap(ctx, TITEL, W - pad * 2).forEach(l => { ctx.fillText(l, pad, y); y += 72; });
    y += 22;
    ctx.fillStyle = GOLD; ctx.fillRect(pad, y, 172, 10);
    y += 46;

    ctx.font = mono('400', 32);
    const pl = this.wrap(ctx, PROMPT, W - pad * 2 - 92);
    const blockH = pl.length * 48 + 60;
    ctx.fillStyle = '#232A31';
    ctx.fillRect(pad, y, W - pad * 2, blockH);
    ctx.fillStyle = ORANGE;
    ctx.fillRect(pad, y, 8, blockH);
    ctx.fillStyle = ORANGE;
    ctx.font = mono('700', 32);
    ctx.fillText('>', pad + 34, y + 30);
    ctx.font = mono('400', 32);
    ctx.fillStyle = '#EDEFF1';
    let py = y + 30;
    pl.forEach(l => { ctx.fillText(l, pad + 74, py); py += 48; });
    y += blockH + 40;

    ctx.font = sans('400', 28);
    ctx.fillStyle = GREY;
    this.wrap(ctx, NOTE, W - pad * 2).forEach(l => { ctx.fillText(l, pad, y); y += 40; });

    ctx.fillStyle = '#1F262C';
    ctx.fillRect(0, H - footH, W, footH);
    ctx.textBaseline = 'middle';
    ctx.font = sans('700', 30);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('Getestet in der Praxis', pad, H - footH / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = GOLD;
    ctx.fillText('mhanwaelte.de', W - pad, H - footH / 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }
  renderVals() { return { cv: this.cv }; }
}
</script>
</body>
</html>
